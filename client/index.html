<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Genel başlık: stüdyo bilgisi gelince sayfa başlığı stüdyonun adına güncellenir (PublicSite). -->
    <title>Pilates Rezervasyon</title>
    <meta name="description" content="Küçük gruplarla pilates: derslerini telefonundan gör, gelemezsen telafiye gel." />
    <!-- Stüdyonun renkleri: sunucu bu dosyayı yönetici panelindeki Görünüm ayarından üretir
         (server/src/routes/theme.js) ve src/index.css'teki renk değişkenlerini ezer. Uygulamanın CSS'i bu satırdan
         sonra yüklenebildiği için dosya "html:root" seçicisini kullanır (":root"tan daha güçlü). Renk girilmemişse
         dosya boş gelir ve varsayılan renkler kalır. -->
    <link rel="stylesheet" href="/brand/theme.css" />
    <!-- Ana ekrana eklenebilir uygulama (PWA). Manifest ve ikonlar her stüdyo için sunucuda üretilir
         (server/src/routes/theme.js): stüdyonun adı, rengi ve ikonu. iOS manifestteki ikonu kullanmaz; apple-touch-icon
         ve apple-mobile-web-app-* etiketleri onun için. Uygulama adı olarak iOS sayfa başlığını (stüdyo adı) alır. -->
    <link rel="manifest" href="/brand/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/brand/icon-192.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
